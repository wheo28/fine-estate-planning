<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinE Estate Planning</title>
<meta name="description" content="Guided educational exercises in estate-planning coordination, including ownership, transfer pathways, wills, incapacity planning, beneficiary records, trust and titling coordination, lifetime transfers and giving, beneficiary coordination as family circumstances change, business succession and estate liquidity, and integrated estate coordination review. Educational only.">
<meta name="color-scheme" content="light">
<style>
/* ---- src/styles/tokens.css ---- */
/* ============================================================
   FinE Estate Planning — shared design tokens
   Source of truth: FinE Companion RC6.10 / FinE Tax Planning
   visual grammar. No Estate-specific color system is invented.

   Grammar rules encoded here:
   - white page canvas
   - restrained Steam-derived neutral surfaces (never beige/Dust cards)
   - Boilermaker Gold used as a thin anchor/accent, never broad fill
   - Black-derived neutral shadows
   - one shared, restrained radius scale
   ============================================================ */

:root {
  /* --- Canvas & Steam-derived neutral surfaces --- */
  --canvas: #ffffff;
  --surface: #f7f6f6;        /* Steam at very low tint */
  --surface-sunken: #efeeee;
  --band: #e8e6e7;
  --line: #dcd9da;
  --line-strong: #c4bfc0;    /* Purdue Steam */

  /* --- Ink (Black-derived + Steel / Cool Gray) --- */
  --ink: #161616;
  --ink-soft: #555960;       /* Purdue Steel   — 6.7:1 on white */
  --ink-faint: #6f727b;      /* Purdue Cool Gray — 4.66:1 on white */
  --ink-invert: #ffffff;

  /* --- Gold anchors (accent only) --- */
  --gold: #cfb991;           /* Boilermaker Gold — rules, markers, anchors */
  --gold-deep: #8e6f3e;      /* Aged Gold — text-safe, 4.66:1 on white */
  --gold-wash: #f7f3ea;      /* reserved for anchored strips, never cards */

  /* --- Shadows: black-derived, neutral, shallow --- */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-2: 0 2px 10px rgba(0, 0, 0, 0.06);

  /* --- Radius: one restrained shared scale --- */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;

  /* --- Rules --- */
  --rule-hair: 1px;
  --rule-anchor: 3px;

  /* --- Space scale --- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;

  /* --- Type --- */
  --font-display: "Source Serif 4", "Iowan Old Style", "Palatino Linotype",
    Palatino, Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-utility: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-base: 0.9375rem;
  --t-md: 1.0625rem;
  --t-lg: 1.3125rem;
  --t-xl: 1.625rem;
  --t-2xl: 2.125rem;

  --lh-tight: 1.2;
  --lh-normal: 1.55;

  /* --- Layout --- */
  --measure: 68ch;
  --shell-max: 1180px;

  /* --- Focus --- */
  --focus-ring: var(--ink);
  --focus-halo: var(--gold);

  /* --- Motion --- */
  --motion-fast: 120ms;
  --motion-base: 200ms;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 0ms;
    --motion-base: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---- src/styles/shell.css ---- */
/* ============================================================
   FinE Estate Planning — shared application shell
   Used by every module (E1…E7). Nothing here is E1-specific.
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--t-base);
  line-height: var(--lh-normal);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: var(--lh-tight);
  margin: 0;
  letter-spacing: -0.01em;
}

p { margin: 0 0 var(--s-3); max-width: var(--measure); }
p:last-child { margin-bottom: 0; }

a { color: var(--ink); text-underline-offset: 2px; }
a:hover { color: var(--gold-deep); }

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--focus-halo);
  border-radius: var(--r-xs);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: var(--s-3);
  top: -60px;
  z-index: 50;
  background: var(--ink);
  color: var(--ink-invert);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-sm);
  font-size: var(--t-sm);
  transition: top var(--motion-fast) ease;
}
.skip-link:focus { top: var(--s-3); color: var(--ink-invert); }

/* ---------- Header ---------- */

.shell-head {
  border-bottom: var(--rule-hair) solid var(--line);
  background: var(--canvas);
}

.shell-head__inner {
  max-width: var(--shell-max);
  margin: 0 auto;
  padding: var(--s-4) var(--s-5);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s-2) var(--s-4);
}

.shell-brand {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
  text-decoration: none;
}

.shell-brand__mark {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-left: var(--rule-anchor) solid var(--gold);
  padding-left: var(--s-2);
}

.shell-brand__name {
  font-family: var(--font-display);
  font-size: var(--t-md);
  font-weight: 600;
}

.shell-head__module {
  margin-left: auto;
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- Layout ---------- */

.shell-main {
  max-width: var(--shell-max);
  margin: 0 auto;
  padding: var(--s-6) var(--s-5) var(--s-8);
}
.shell-main:focus { outline: none; }

.module-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: var(--s-7);
  align-items: start;
}

@media (max-width: 900px) {
  .module-layout { grid-template-columns: minmax(0, 1fr); gap: var(--s-5); }
  .shell-main { padding: var(--s-5) var(--s-4) var(--s-7); }
}

/* ---------- Module masthead ---------- */

.module-head { margin-bottom: var(--s-5); }

.module-head__eyebrow {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin: 0 0 var(--s-2);
}

.module-head__title {
  font-size: var(--t-2xl);
  margin-bottom: var(--s-3);
}

.module-head__lede {
  color: var(--ink-soft);
  font-size: var(--t-md);
  max-width: var(--measure);
}

/* ---------- Progress ---------- */

.stage-nav { margin: 0 0 var(--s-5); }

.stage-nav__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-1);
  border-top: var(--rule-hair) solid var(--line);
  padding-top: var(--s-3);
}

.stage-nav__item { flex: 1 1 120px; min-width: 96px; }

.stage-nav__btn {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-top: var(--rule-anchor) solid var(--line);
  padding: var(--s-2) var(--s-2) var(--s-2) 0;
  margin-top: -1px;
  font: inherit;
  font-size: var(--t-xs);
  color: var(--ink-faint);
  cursor: pointer;
  display: block;
}

.stage-nav__btn:hover:not([disabled]) { color: var(--ink); }
.stage-nav__btn[disabled] { cursor: default; opacity: 0.55; }

.stage-nav__btn[aria-current="step"] {
  border-top-color: var(--gold);
  color: var(--ink);
  font-weight: 600;
}

.stage-nav__num {
  font-family: var(--font-utility);
  display: block;
  letter-spacing: 0.08em;
}

.stage-nav__done::after {
  content: " ✓";
  color: var(--gold-deep);
}

/* ---------- Stage frame ---------- */

.stage { min-height: 40vh; }

.stage__title {
  font-size: var(--t-xl);
  margin-bottom: var(--s-3);
}

.stage__intro {
  color: var(--ink-soft);
  margin-bottom: var(--s-5);
}

.stage-foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-3);
  align-items: center;
  margin-top: var(--s-6);
  padding-top: var(--s-4);
  border-top: var(--rule-hair) solid var(--line);
}

.stage-foot__hint {
  font-size: var(--t-sm);
  color: var(--ink-faint);
  margin: 0;
}

/* ---------- Buttons ---------- */

.btn {
  font: inherit;
  font-size: var(--t-base);
  padding: var(--s-2) var(--s-5);
  border-radius: var(--r-sm);
  border: var(--rule-hair) solid var(--ink);
  background: var(--ink);
  color: var(--ink-invert);
  cursor: pointer;
  transition: background var(--motion-fast) ease, color var(--motion-fast) ease;
}
.btn:hover:not([disabled]) { background: #000; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.btn--quiet {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}
.btn--quiet:hover:not([disabled]) { background: var(--surface); color: var(--ink); }

.btn--link {
  background: none;
  border: 0;
  padding: var(--s-1) 0;
  color: var(--gold-deep);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn--link:hover { color: var(--ink); }

/* ---------- Case-file rail ---------- */

.rail {
  border-top: var(--rule-anchor) solid var(--gold);
  padding-top: var(--s-3);
  font-size: var(--t-sm);
}

.rail__title {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 var(--s-3);
}

.rail__group { margin-bottom: var(--s-4); }

.rail__label {
  font-size: var(--t-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin: 0 0 var(--s-1);
}

.rail__list { list-style: none; margin: 0; padding: 0; }

.rail__list li {
  padding: var(--s-1) 0;
  border-bottom: var(--rule-hair) solid var(--line);
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  gap: var(--s-3);
}
.rail__list li span:first-child { color: var(--ink); }

.rail__note {
  font-size: var(--t-xs);
  color: var(--ink-faint);
  margin: 0;
}

@media (min-width: 901px) {
  .rail--collapsible > summary { display: none; }
}

@media (max-width: 900px) {
  .rail { border-top-width: var(--rule-hair); }
  .rail__title { display: none; }
  .rail--collapsible > summary {
    cursor: pointer;
    font-family: var(--font-utility);
    font-size: var(--t-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: var(--s-2) 0;
  }
}

/* ---------- Boundary notice ---------- */

.notice {
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
  padding: var(--s-3) var(--s-4);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: var(--t-sm);
  color: var(--ink-soft);
  margin: 0 0 var(--s-5);
}
.notice p { max-width: none; }
.notice strong { color: var(--ink); }

.notice--foot { margin: var(--s-6) 0 0; }

/* ---------- Footer ---------- */

.shell-foot {
  border-top: var(--rule-hair) solid var(--line);
  margin-top: var(--s-7);
  background: var(--canvas);
}

.shell-foot__inner {
  max-width: var(--shell-max);
  margin: 0 auto;
  padding: var(--s-5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-5);
  font-size: var(--t-sm);
  color: var(--ink-faint);
}

.shell-foot__inner p { margin: 0; }
.shell-foot__credit { color: var(--ink-soft); }

/* ---------- Module index (shell home) ---------- */

.index-list { list-style: none; margin: var(--s-5) 0 0; padding: 0; }

.index-list li {
  border-top: var(--rule-hair) solid var(--line);
  padding: var(--s-4) 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-4);
  align-items: baseline;
}

.index-list__code {
  font-family: var(--font-utility);
  font-size: var(--t-sm);
  color: var(--gold-deep);
  letter-spacing: 0.08em;
  min-width: 3em;
}

.index-list__body { flex: 1 1 320px; }
.index-list__body h2 { font-size: var(--t-md); margin-bottom: var(--s-1); }
.index-list__body p { font-size: var(--t-sm); color: var(--ink-soft); margin: 0; }

/* ---- src/styles/module.css ---- */
/* ============================================================
   FinE Estate Planning — shared instructional primitives
   Reusable by every module: asset inventory, question sets,
   reasoning feedback, pathway chain, classification lanes.
   ============================================================ */

/* ---------- Household card ---------- */

.household {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--s-4);
  margin: 0 0 var(--s-5);
  padding: 0;
  list-style: none;
}

.person {
  border-top: var(--rule-anchor) solid var(--gold);
  padding-top: var(--s-3);
}

.person__name { font-size: var(--t-md); margin-bottom: var(--s-1); }

.person__role {
  font-size: var(--t-sm);
  color: var(--ink-soft);
  margin: 0;
}

.goals {
  margin: 0 0 var(--s-5);
  padding: var(--s-4);
  background: var(--surface);
  border: var(--rule-hair) solid var(--line);
  border-radius: var(--r-sm);
}
.goals h3 { font-size: var(--t-base); margin-bottom: var(--s-2); }
.goals ul { margin: 0; padding-left: 1.1em; color: var(--ink-soft); }
.goals li { margin-bottom: var(--s-1); }

/* ---------- Asset inventory ---------- */

.inventory { list-style: none; margin: 0; padding: 0; }

.asset {
  border-top: var(--rule-hair) solid var(--line);
}
.asset:last-child { border-bottom: var(--rule-hair) solid var(--line); }

.asset > summary {
  cursor: pointer;
  padding: var(--s-3) var(--s-2) var(--s-3) var(--s-4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-1) var(--s-3);
  align-items: baseline;
  border-left: var(--rule-anchor) solid transparent;
  list-style: none;
}
.asset > summary::-webkit-details-marker { display: none; }
.asset > summary:hover { background: var(--surface); }
.asset[open] > summary {
  border-left-color: var(--gold);
  background: var(--surface);
}

.asset__name { font-family: var(--font-display); font-size: var(--t-md); font-weight: 600; }
.asset__owner { font-size: var(--t-sm); color: var(--ink-soft); }
.asset__value {
  margin-left: auto;
  font-family: var(--font-utility);
  font-size: var(--t-sm);
  color: var(--ink-soft);
  white-space: nowrap;
}
.asset__body {
  padding: 0 var(--s-4) var(--s-4) var(--s-4);
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
}

.facts { margin: 0; display: grid; grid-template-columns: 13em 1fr; gap: var(--s-1) var(--s-4); }
.facts dt { color: var(--ink-faint); font-size: var(--t-sm); }
.facts dd { margin: 0; font-size: var(--t-sm); }
.facts dd.is-gap { color: var(--gold-deep); font-weight: 600; }

@media (max-width: 620px) {
  .facts { grid-template-columns: 1fr; gap: 0 0; }
  .facts dt { margin-top: var(--s-2); }
  .asset__value { margin-left: 0; }
}

.inventory-progress {
  font-size: var(--t-sm);
  color: var(--ink-soft);
  margin: var(--s-4) 0 0;
}

/* ---------- Question sets ---------- */

.qset { border: 0; padding: 0; margin: 0 0 var(--s-5); min-width: 0; }

.qset > legend {
  font-family: var(--font-body);
  font-size: var(--t-base);
  font-weight: 600;
  padding: 0;
  margin-bottom: var(--s-2);
}

.qset__help {
  font-size: var(--t-sm);
  color: var(--ink-faint);
  margin: 0 0 var(--s-3);
}

.choices { display: grid; gap: var(--s-2); }

.choice {
  display: flex;
  gap: var(--s-3);
  align-items: flex-start;
  padding: var(--s-3);
  border: var(--rule-hair) solid var(--line);
  border-radius: var(--r-sm);
  background: var(--canvas);
  cursor: pointer;
  font-size: var(--t-base);
  transition: border-color var(--motion-fast) ease, background var(--motion-fast) ease;
}
.choice:hover { border-color: var(--line-strong); background: var(--surface); }
.choice input { margin: 2px 0 0; accent-color: var(--ink); flex: none; }
.choice.is-selected,
.choice:has(input:checked) {
  border-color: var(--gold-deep);
  box-shadow: inset var(--rule-anchor) 0 0 0 var(--gold);
  background: var(--surface);
}
.choice:has(input:disabled) { cursor: default; opacity: 0.85; }
.choice__text { display: block; }
.choice__note { display: block; font-size: var(--t-sm); color: var(--ink-faint); }

/* ---------- Reasoning feedback ---------- */

.feedback {
  margin: var(--s-4) 0 0;
  padding: var(--s-3) var(--s-4);
  border: var(--rule-hair) solid var(--line);
  border-left-width: var(--rule-anchor);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: var(--surface);
  font-size: var(--t-base);
}
.feedback__label {
  display: block;
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: var(--s-1);
}
.feedback--resolved { border-left-color: var(--ink); }
.feedback--revisit { border-left-color: var(--gold); }
.feedback p { margin-bottom: var(--s-2); }
.feedback p:last-child { margin-bottom: 0; }

/* ---------- Pathway chain (signature element) ---------- */

.pathway { list-style: none; margin: var(--s-3) 0 0; padding: 0; }

.pathway__row {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s-1);
  padding: var(--s-3) 0 var(--s-3) var(--s-4);
  border-top: var(--rule-hair) solid var(--line);
  border-left: var(--rule-anchor) solid var(--gold);
}
.pathway__row:last-child { border-bottom: var(--rule-hair) solid var(--line); }
.pathway__row--unknown { border-left-style: dashed; border-left-color: var(--gold-deep); }

.pathway__asset { font-family: var(--font-display); font-size: var(--t-md); font-weight: 600; }

.pathway__chain {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s-1) var(--s-2);
  font-size: var(--t-sm);
  color: var(--ink-soft);
  margin: 0;
}

.pathway__node { display: inline-flex; align-items: baseline; gap: var(--s-1); }
.pathway__node--mech { color: var(--ink); font-weight: 600; }
.pathway__node--end { color: var(--ink); }
.pathway__node--unknown { color: var(--gold-deep); font-weight: 600; }

.pathway__arrow { color: var(--gold-deep); font-family: var(--font-utility); }

.pathway__flag {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- Classification lanes (will / not / cannot determine) ---------- */

.lane-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--s-4);
  margin: var(--s-5) 0 0;
}

.lane {
  border-top: var(--rule-anchor) solid var(--line-strong);
  padding-top: var(--s-3);
}
.lane--yes { border-top-style: solid; border-top-color: var(--ink); }
.lane--no { border-top-style: double; border-top-width: 4px; border-top-color: var(--line-strong); }
.lane--unknown { border-top-style: dashed; border-top-color: var(--gold-deep); }

.lane__title { font-size: var(--t-base); margin-bottom: var(--s-1); }
.lane__glyph { font-family: var(--font-utility); color: var(--ink-soft); }
.lane__count { font-family: var(--font-utility); font-size: var(--t-sm); color: var(--ink-faint); }
.lane__list { list-style: none; margin: var(--s-2) 0 0; padding: 0; font-size: var(--t-sm); }
.lane__list li { padding: var(--s-1) 0; border-bottom: var(--rule-hair) solid var(--line); }
.lane__empty { color: var(--ink-faint); font-size: var(--t-sm); margin: var(--s-2) 0 0; }

/* ---------- Sorting rows (Stage 4) ---------- */

.sorter { list-style: none; margin: 0; padding: 0; }

.sort-row {
  border-top: var(--rule-hair) solid var(--line);
  padding: var(--s-3) 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, auto);
  gap: var(--s-2) var(--s-4);
  align-items: center;
}
.sort-row:last-child { border-bottom: var(--rule-hair) solid var(--line); }

.sort-row__label { font-size: var(--t-base); }
.sort-row__meta { display: block; font-size: var(--t-sm); color: var(--ink-faint); }

.segmented { display: flex; flex-wrap: wrap; gap: var(--s-1); border: 0; padding: 0; margin: 0; min-width: 0; }
.segmented > legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.seg {
  border: var(--rule-hair) solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: var(--s-1) var(--s-3);
  font-size: var(--t-sm);
  cursor: pointer;
  background: var(--canvas);
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  white-space: nowrap;
}
.seg:hover { background: var(--surface); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg.is-selected,
.seg:has(input:checked) {
  background: var(--ink);
  color: var(--ink-invert);
  border-color: var(--ink);
}
.seg:has(input:focus-visible),
.seg:focus-within {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--focus-halo);
}
.seg__glyph { font-family: var(--font-utility); }

@media (max-width: 620px) {
  .sort-row { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Result callouts ---------- */

.takeaway {
  margin: var(--s-6) 0 0;
  padding: var(--s-5);
  border: var(--rule-hair) solid var(--line);
  border-top: var(--rule-anchor) solid var(--gold);
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  background: var(--canvas);
  box-shadow: var(--shadow-1);
}
.takeaway h3 { font-size: var(--t-lg); margin-bottom: var(--s-2); }
.takeaway p { color: var(--ink-soft); }

.scorecard {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-5);
  margin: 0 0 var(--s-4);
  padding: 0;
  list-style: none;
  font-size: var(--t-sm);
}
.scorecard div { border-left: var(--rule-anchor) solid var(--gold); padding-left: var(--s-3); }
.scorecard dt { color: var(--ink-faint); }
.scorecard dd { margin: 0; font-family: var(--font-utility); font-size: var(--t-md); color: var(--ink); }

.limits { margin: var(--s-5) 0 0; }
.limits h3 { font-size: var(--t-base); margin-bottom: var(--s-2); }
.limits ul { margin: 0; padding-left: 1.1em; color: var(--ink-soft); font-size: var(--t-sm); }
.limits li { margin-bottom: var(--s-1); }

.recall {
  border-left: var(--rule-anchor) solid var(--line-strong);
  padding-left: var(--s-4);
  margin: 0 0 var(--s-5);
  font-size: var(--t-sm);
  color: var(--ink-soft);
}
.recall strong { color: var(--ink); }

/* ---------- Stage counters ---------- */

.stage-count {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-2);
}

/* ---------- Quiet supporting note (used outside the rail) ---------- */

.note-quiet {
  font-size: var(--t-xs);
  color: var(--ink-faint);
  margin: 0;
  max-width: var(--measure);
}

/* ---------- Transfer pathway (separate from governing mechanism) ---------- */

.pathway__node--path { color: var(--ink-soft); font-variant-caps: all-small-caps; letter-spacing: 0.06em; }

.pathway-teach {
  margin: var(--s-3) 0 0;
  font-size: var(--t-sm);
  color: var(--ink-soft);
}
.pathway-teach__label {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.pathway-teach__value { font-weight: 600; color: var(--ink); }

/* ---------- Stage 4 bridge: will control -> transfer pathway ---------- */

.bridge {
  margin: var(--s-5) 0 0;
  padding: var(--s-4) var(--s-5);
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.bridge h3 { font-size: var(--t-base); margin-bottom: var(--s-2); }
.bridge p { font-size: var(--t-sm); color: var(--ink-soft); }
.bridge ul { margin: 0 0 var(--s-3); padding-left: 1.1em; font-size: var(--t-sm); color: var(--ink-soft); }
.bridge li { margin-bottom: var(--s-1); }
.bridge__takeaway { color: var(--ink); margin: 0; }

/* ---- src/styles/module-e2.css ---- */
/* ============================================================
   E2 additions to the shared instructional primitives.

   Separate file, not appended to module.css, so the locked E1
   bundle stays byte-reproducible. Every value here comes from
   the existing token set — no new colors, radii, or shadows.
   ============================================================ */

/* ---------- Document / record cards ---------- */

.record-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--s-4);
  margin: 0 0 var(--s-5);
}

.record {
  border-top: var(--rule-anchor) solid var(--gold);
  padding-top: var(--s-3);
}

.record--absent { border-top-style: dashed; border-top-color: var(--gold-deep); }

.record__name { font-size: var(--t-base); margin: 0 0 var(--s-1); }

.record__status {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-2);
}

.record__job { font-size: var(--t-sm); color: var(--ink-soft); margin: var(--s-2) 0 0; }

.record__joblabel {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- Stage sub-headings ---------- */

.stage-sub {
  font-size: var(--t-md);
  margin: var(--s-6) 0 var(--s-3);
  padding-bottom: var(--s-1);
  border-bottom: var(--rule-hair) solid var(--line);
}

.note-list {
  margin: var(--s-2) 0 0;
  padding-left: 1.1em;
  font-size: var(--t-sm);
}
.note-list li { margin-bottom: var(--s-1); }

/* ---------- Job / mechanism summary ---------- */

.joblist { list-style: none; margin: var(--s-3) 0 0; padding: 0; }

.joblist__row {
  display: grid;
  grid-template-columns: 5em minmax(0, 1fr) 14em;
  gap: var(--s-2) var(--s-3);
  padding: var(--s-2) 0;
  border-top: var(--rule-hair) solid var(--line);
  font-size: var(--t-sm);
  align-items: baseline;
}

.joblist__letter { font-family: var(--font-utility); color: var(--ink-faint); }
.joblist__job { color: var(--ink-soft); }
.joblist__mech { font-weight: 600; }

@media (max-width: 620px) {
  .joblist__row { grid-template-columns: minmax(0, 1fr); gap: var(--s-1); }
}

/* ---------- Role comparison ---------- */

.rolegrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--s-4);
  margin: var(--s-3) 0 0;
}

.rolegrid__cell { border-left: var(--rule-anchor) solid var(--gold); padding-left: var(--s-3); }
.rolegrid__cell h4 { font-size: var(--t-base); margin: 0 0 var(--s-2); }
.rolegrid__cell p { font-size: var(--t-sm); color: var(--ink-soft); margin: 0; }
.rolegrid .facts { grid-template-columns: 1fr; gap: 0; }

/* ---------- Coordination review ---------- */

.review { margin: var(--s-6) 0 0; }
.review h3 {
  font-size: var(--t-lg);
  margin-bottom: var(--s-3);
  padding-bottom: var(--s-2);
  border-bottom: var(--rule-anchor) solid var(--gold);
}

.review__group { margin-bottom: var(--s-4); }
.review__person { font-size: var(--t-base); margin: 0 0 var(--s-1); }

.review__list { list-style: none; margin: 0; padding: 0; font-size: var(--t-sm); }

.review__list li {
  padding: var(--s-2) 0 var(--s-2) var(--s-3);
  border-bottom: var(--rule-hair) solid var(--line);
  border-left: var(--rule-anchor) solid var(--line);
}
.review__list li.is-gap { border-left-style: dashed; border-left-color: var(--gold-deep); }

.review__record { color: var(--ink-soft); }
.review__arrow { color: var(--gold-deep); font-family: var(--font-utility); }
.review__value { font-weight: 600; }
.review__list li.is-gap .review__value { color: var(--gold-deep); }

.review__note {
  display: block;
  color: var(--ink-soft);
  font-size: var(--t-sm);
  margin-top: var(--s-1);
}

.verify { margin: 0 0 var(--s-3); padding-left: 1.3em; font-size: var(--t-base); }
.verify li { margin-bottom: var(--s-2); max-width: var(--measure); }

/* ---- src/styles/module-e3.css ---- */
/* ============================================================
   E3 additions to the shared instructional primitives.

   Separate file, following the E2 pattern, so the locked E1 and
   E2 bundles are unaffected. Every value comes from the existing
   token set — no new colors, radii, or shadows, and no
   trust-specific palette.

   The three classification states are distinguished by glyph,
   border style, and text label. Color never carries the meaning.
   ============================================================ */

/* ---------- Trust packet ---------- */

.packet {
  border-top: var(--rule-anchor) solid var(--gold);
  padding-top: var(--s-3);
  margin: 0 0 var(--s-5);
}

.packet__name { font-size: var(--t-md); margin: 0 0 var(--s-3); }
.packet .facts { margin-bottom: var(--s-3); }

/* ---------- Two-sided record comparison ---------- */

.compare {
  border-top: var(--rule-hair) solid var(--line);
  padding-top: var(--s-3);
  margin: 0 0 var(--s-3);
}

.compare__name { font-size: var(--t-base); margin: 0 0 var(--s-1); }

.compare__kind {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-3);
}

.compare__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--s-3) var(--s-5);
}

.compare__side { border-left: var(--rule-anchor) solid var(--line-strong); padding-left: var(--s-3); }
.compare__side--asset { border-left-color: var(--gold); }

.compare__label {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-1);
}

.compare__text { font-size: var(--t-sm); color: var(--ink); margin: 0; max-width: none; }

/* ---------- Classification tags ---------- */

/* The verify label is a full sentence fragment, so it must be free to wrap.
   nowrap made it overflow its grid column and collide with the next one. */
.tag {
  display: inline-flex;
  align-items: baseline;
  gap: var(--s-1);
  font-size: var(--t-sm);
  white-space: normal;
  text-wrap: pretty;
}

.tag__glyph { flex: none; }

.tag__glyph { font-family: var(--font-utility); color: var(--gold-deep); }

.tag--clear { font-weight: 600; }
.tag--separate { color: var(--ink-soft); }
.tag--verify { color: var(--gold-deep); font-weight: 600; }

/* ---------- Outcome key ---------- */

.key {
  border: var(--rule-hair) solid var(--line);
  border-top: var(--rule-anchor) solid var(--gold);
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  background: var(--surface);
  padding: var(--s-4);
  margin: 0 0 var(--s-5);
}

.key__title { font-size: var(--t-base); margin: 0 0 var(--s-2); }
.key__list { list-style: none; margin: 0 0 var(--s-3); padding: 0; }

.key__list li {
  display: grid;
  grid-template-columns: minmax(0, 15em) minmax(0, 1fr);
  gap: var(--s-1) var(--s-4);
  padding: var(--s-2) 0;
  align-items: baseline;
}

.key__desc { font-size: var(--t-sm); color: var(--ink-soft); }

@media (max-width: 620px) {
  .key__list li { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Stacked classification rows ---------- */

.sort-row--stacked {
  display: block;
  padding: var(--s-4) 0;
}

.sort-row--stacked .segmented { margin-top: var(--s-3); }

/* ---------- Resolved outcome summary ---------- */

.outcome-list { list-style: none; margin: var(--s-3) 0 0; padding: 0; }

.outcome-list__row {
  display: grid;
  grid-template-columns: minmax(0, 13em) minmax(0, 13em) minmax(0, 1.4fr);
  gap: var(--s-1) var(--s-4);
  padding: var(--s-3) 0;
  border-top: var(--rule-hair) solid var(--line);
  align-items: baseline;
  font-size: var(--t-sm);
}

.outcome-list__name { font-weight: 600; }
.outcome-list__why { color: var(--ink-soft); }

@media (max-width: 900px) {
  .outcome-list__row { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Stage 5 movement ---------- */

.moved {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s-2);
  margin: var(--s-4) 0 var(--s-5);
  padding: var(--s-3) var(--s-4);
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: var(--t-sm);
}

.moved__arrow { color: var(--gold-deep); font-family: var(--font-utility); }

/* ---- src/styles/module-e4.css ---- */
/* ============================================================
   E4 additions to the shared instructional primitives.

   Separate file, following the E2 and E3 pattern, so the locked
   bundles are unaffected. Every value comes from the existing
   token set — no new colors, and deliberately no semantic color
   at all in this module.

   Numbers are made scannable by type scale, weight, and rules,
   not by hue. There is no green for "savings" and no red for
   "tax", because this module does not rank the two options and
   colored figures would do the ranking for it.
   ============================================================ */

/* ---------- Claim block (Stage 1) ---------- */

.claim {
  margin: 0 0 var(--s-5);
  padding: var(--s-4) var(--s-5);
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

.claim p {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--t-md);
  color: var(--ink);
}

/* ---------- Calculation panel ---------- */

.calc {
  margin: 0 0 var(--s-5);
  padding: var(--s-4) var(--s-5);
  border: var(--rule-hair) solid var(--line);
  border-top: var(--rule-anchor) solid var(--gold);
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  background: var(--canvas);
  box-shadow: var(--shadow-1);
}

.calc__title {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-3);
}

.calc__rows {
  margin: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--s-1) var(--s-4);
}

.calc__rows dt { color: var(--ink-soft); font-size: var(--t-sm); }

.calc__rows dd {
  margin: 0;
  font-family: var(--font-utility);
  font-size: var(--t-base);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.calc__result {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s-2) var(--s-4);
  margin: var(--s-3) 0 0;
  padding-top: var(--s-3);
  border-top: var(--rule-hair) solid var(--line-strong);
  max-width: none;
}

.calc__result-label { font-size: var(--t-sm); color: var(--ink); font-weight: 600; }

.calc__result-value {
  font-family: var(--font-utility);
  font-size: var(--t-lg);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.calc__caveat {
  margin: var(--s-3) 0 0;
  font-size: var(--t-sm);
  color: var(--ink-soft);
  max-width: none;
}

/* ---------- Federal context card ---------- */

.context {
  margin: var(--s-5) 0 0;
  padding: var(--s-4) var(--s-5);
  border-left: var(--rule-anchor) solid var(--gold);
  background: var(--surface);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

.context__title { font-size: var(--t-base); margin: 0 0 var(--s-1); }

.context__value {
  font-family: var(--font-utility);
  font-size: var(--t-xl);
  font-variant-numeric: tabular-nums;
  margin: 0 0 var(--s-3);
}

.context p { font-size: var(--t-sm); color: var(--ink-soft); }

/* ---------- Assumption disclosure ---------- */

.assumptions {
  margin: var(--s-4) 0 0;
  border-top: var(--rule-hair) solid var(--line);
  padding-top: var(--s-2);
}

.assumptions > summary {
  cursor: pointer;
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: var(--s-1) 0;
}

.assumptions ul {
  margin: var(--s-2) 0 var(--s-2);
  padding-left: 1.1em;
  font-size: var(--t-sm);
  color: var(--ink-soft);
}

.assumptions li { margin-bottom: var(--s-1); max-width: var(--measure); }

/* ---------- Comparison table ---------- */

.compare-table {
  width: 100%;
  border-collapse: collapse;
  margin: var(--s-5) 0;
  font-size: var(--t-sm);
}

.compare-table caption {
  text-align: left;
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-bottom: var(--s-2);
}

.compare-table th,
.compare-table td {
  text-align: left;
  vertical-align: top;
  padding: var(--s-3) var(--s-3) var(--s-3) 0;
  border-bottom: var(--rule-hair) solid var(--line);
}

.compare-table thead th {
  border-bottom: var(--rule-anchor) solid var(--gold);
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--ink);
}

.compare-table tbody th {
  font-weight: 400;
  color: var(--ink-faint);
  width: 15em;
  padding-right: var(--s-4);
}

@media (max-width: 720px) {
  /* The caption must be switched to block along with everything else. Left as
     display: table-caption inside a block-display table it collapses to the
     width of its widest character and renders one letter per line. */
  .compare-table,
  .compare-table caption,
  .compare-table thead,
  .compare-table tbody,
  .compare-table tr,
  .compare-table th,
  .compare-table td { display: block; width: auto; }

  .compare-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .compare-table tbody tr {
    border-top: var(--rule-anchor) solid var(--gold);
    padding-top: var(--s-2);
    margin-bottom: var(--s-4);
  }

  .compare-table tbody th { border-bottom: 0; padding-bottom: var(--s-1); }

  .compare-table td { border-bottom: var(--rule-hair) solid var(--line); padding-left: var(--s-3); }
  .compare-table td::before {
    content: attr(data-column);
    display: block;
    font-family: var(--font-utility);
    font-size: var(--t-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
}

/* ---- src/styles/module-e5.css ---- */
/* ============================================================
   E5 additions to the shared instructional primitives.

   Separate file, following the pattern from E2 onward, so the
   locked bundles are unaffected. Every value comes from the
   existing token set — no family-tree palette, no risk
   dashboard, no new colors.

   Primary / contingent / not-shown are carried by field name,
   text label, and glyph. A dashed border is a secondary cue
   only; color never carries the meaning.
   ============================================================ */

/* ---------- Beneficiary record ---------- */

.brecord {
  border-top: var(--rule-anchor) solid var(--gold);
  padding-top: var(--s-3);
  margin: 0 0 var(--s-4);
}

.brecord__name { font-size: var(--t-base); margin: 0 0 var(--s-1); }

.brecord__kind {
  font-family: var(--font-utility);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 var(--s-3);
}

.brecord__fields {
  margin: 0;
  display: grid;
  grid-template-columns: 13em minmax(0, 1fr);
  gap: var(--s-1) var(--s-4);
}

.brecord__fields dt { color: var(--ink-faint); font-size: var(--t-sm); }
.brecord__fields dd { margin: 0; font-size: var(--t-sm); }

.brecord__fields dd.is-notshown {
  color: var(--gold-deep);
  font-weight: 600;
}

.brecord__glyph { font-family: var(--font-utility); color: var(--ink-faint); }
.is-notshown .brecord__glyph { color: var(--gold-deep); }

.brecord__continuity {
  margin: var(--s-3) 0 0;
  padding-left: var(--s-3);
  border-left: var(--rule-anchor) solid var(--line-strong);
  font-size: var(--t-sm);
  color: var(--ink-soft);
  max-width: var(--measure);
}

@media (max-width: 620px) {
  .brecord__fields { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .brecord__fields dt { margin-top: var(--s-2); }
}

.brecord-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

    const state = ctx.state;

    const atLimit = chosen.length >= PRIORITY_COUNT;

      const inputId = uid(`priority-${issue.id}`);
      const selected = Boolean(state.priorities[issue.id]);
      const input = el('input', {
        type: 'checkbox',
        id: inputId,
        value: issue.id,
        checked: selected,
        disabled: state.prioritiesLocked || (!selected && atLimit),
        onChange: (e) => {
          state.priorities[issue.id] = e.target.checked;
          if (!e.target.checked) delete state.rationales[issue.id];
          ctx.refresh();
        },
      });
      wrap.appendChild(el('label.choice', { for: inputId }, [

        el('span.choice__text', { text: issue.label }),

      role: 'status',
      'aria-live': 'polite',
      text: `${chosen.length} of ${PRIORITY_COUNT} selected.`
        + (atLimit ? ' Clear one to choose a different issue.' : ''),
    }));

      const rationale = el('section.rationale');
      rationale.appendChild(el('h3', { text: 'Why each one, first?' }));
      rationale.appendChild(el('p', { text: RATIONALE_INSTRUCTION }));

        row.appendChild(el('div', null, el('span.sort-row__label', { text: issue.label })));
        const select = el('select.rationale__select', {
          id: rowId,
          'aria-label': `Rationale for ${issue.label}`,
          disabled: state.prioritiesLocked,
          onChange: (e) => { state.rationales[issue.id] = e.target.value || null; },

          }));
