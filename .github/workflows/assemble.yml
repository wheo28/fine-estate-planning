name: Assemble verified FinE Estate Planning

on:
  push:
    paths:
      - '.assemble/**'
      - '.github/workflows/assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify locked artifact
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .assemble/p01 \
            .assemble/p02 .assemble/p02b \
            .assemble/p03 \
            .assemble/p04p05 \
            .assemble/p06p07 \
            .assemble/p08p09 \
            .assemble/p10p11 \
            .assemble/p12p13 \
            .assemble/p14p15 \
            .assemble/p16p17 \
            .assemble/p18 \
            .assemble/p19 \
            > /tmp/fine-estate.b64
          base64 -d /tmp/fine-estate.b64 > /tmp/fine-estate.html.gz
          gzip -dc /tmp/fine-estate.html.gz > index.html
          echo 'aa445f1e05d6175cb2b42bdd4815c029552cb3996a1a09e93425f2f462b9eee1  index.html' | sha256sum -c -

      - name: Commit verified index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Assemble verified FinE Estate Planning'
            git push
          fi
